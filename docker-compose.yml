services:
  neo4j:
    image: neo4j:${NEO4J_VERSION}
    container_name: mikg-neo4j
    restart: unless-stopped # 재부팅 자동 기동
    ports:
      - "7475:7474" # Neo4j Browser UI
      - "7688:7687" # Bolt 프로토콜. 드라이버 연동용
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD} # 초기 계정. 비번 8자 이상
      - HC_USER=${NEO4J_USER} # healthcheck에서 참조하려고 개별로도 넘김
      - HC_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"] # 대량적재·JSON로딩 확장. 첫 기동 시 자동 다운로드

      # APOC이 파일을 읽고 쓰도록 허용. 기본값 false (보안상 막혀있음)
      - NEO4J_apoc_export_file_enabled=true # 그래프를 CSV/JSON으로 내보내기
      - NEO4J_apoc_import_file_enabled=true # 로컬 파일을 apoc.load로 읽기

      # JVM 메모리 설정
      - NEO4J_server_memory_heap_initial__size=1G # JVM 힙 시작 크기
      - NEO4J_server_memory_heap_max__size=2G # JVM 힙 최대. 쿼리 실행에 사용
      - NEO4J_server_memory_pagecache_size=1G # 그래프 데이터 캐싱. 순회 성능 좌우
    volumes: #도커 컨테이너 데이터 유실 방지(컴퓨터(호스트)의 폴더를 Neo4j 컨테이너 안의 폴더로 연결(동기화))
      - ./neo4j/data:/data # DB 실체. 없으면 컨테이너 삭제 시 데이터 전부 소실
      - ./neo4j/logs:/logs # 컨테이너 밖에서 로그 확인용
      - ./neo4j/import:/var/lib/neo4j/import # CSV 대량 적재 시 파일 두는 곳
      - ./neo4j/plugins:/plugins # APOC jar 캐싱. 재기동 시 재다운로드 방지
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${HC_USER} -p $${HC_PASSWORD} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s # 첫 기동은 플러그인 설치로 오래 걸림. 그 동안 실패로 안 침

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: mikg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mikg
    ports:
      - "5433:5432" # Neo4j가 7475/7688 썼던 것처럼, 충돌 방지로 5433 제안
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d mikg"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:${MONGO_VERSION} # 버전 결정 필요
    container_name: mikg-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: mikg
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
  opensearch:
    build:
      context: . # DockerFile 경로
      dockerfile: Dockerfile_OpenSearch # DockerFile명
    container_name: mikg-opensearch
    environment:
      - discovery.type=single-node # 단일 노드 모드 (클러스터 구성 스킵)
      - DISABLE_SECURITY_PLUGIN=true # 로컬 실습이라 인증/TLS 비활성화 (운영에선 절대 X)
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # 로컬 리소스 절약용 힙 사이즈 제한
    ports:
      - "9200:9200" # REST API 포트
      - "9600:9600" # 성능 분석 포트 (선택)
    volumes:
      - opensearch-data:/usr/share/opensearch/data # 컨테이너 재시작해도 데이터 유지

  dashboards: #키바나 역할
    image: opensearchproject/opensearch-dashboards:3.8.0 # OpenSearch 코어와 버전 맞춤 (버전 안 맞으면 호환 이슈 남)
    container_name: mikg-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]' # opensearch: docker-compose 서비스명으로 접속 (localhost 아님)
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true # opensearch 쪽 보안도 껐으니 여기도 맞춰서 끔
    depends_on:
      - opensearch

volumes:
  postgres_data:
  mongodb_data:
  opensearch-data:
