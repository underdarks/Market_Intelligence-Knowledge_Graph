[project]
name = "market-intelligence-knowledge-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "seogjaehyeon", email = "rkdrl45617@gmail.com" }
]

[tool.black]
line-length = 120

requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.53.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "lxml>=6.1.2",
    "neo4j-graphrag>=1.19.0",
    "opensearch-py>=3.2.0",
    "pydantic>=2.13.4",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
market-intelligence-knowledge-graph = "market_intelligence_knowledge_graph:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 마커 등록: 미등록 마커는 경고가 뜨고, 오타 난 마커를 못 잡음
markers = ["integration: 실제 외부 시스템(Neo4j 등)이 필요한 테스트"]
# 기본 실행에서 통합 테스트 제외. 명령줄 -m 이 뒤에 붙으면 이 값을 덮어씀
addopts = "-m 'not integration'"